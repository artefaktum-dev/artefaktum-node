# Publishes to npm from the public mirror on a `v*` tag, with a provenance attestation.
# Provenance needs `id-token: write`, a public repository, and a `repository` field in
# package.json that points back here -- npm rejects the attestation otherwise.
# No secret: npm trusted publishing (OIDC). npmjs.com → artefaktum → Trusted Publishers must list
# GitHub Actions, owner artefaktum-dev, repository artefaktum-node, workflow release.yml.
# Trusted publishing needs npm >= 11.5.1, hence the npm upgrade step.
name: release

on:
  push:
    tags: ["v*"]

permissions: { contents: read }

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm ci
      # `prepublishOnly` runs these again during `npm publish`. Kept explicit anyway: a
      # failure here names the step that broke instead of failing inside the publish.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run check:types
      # A tag that disagrees with the packaged version would publish something nobody can
      # find by the name they tagged.
      - name: tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          echo "tag=$tag package.json=$declared"
          test "$tag" = "$declared"
      # --access and --provenance also come from package.json's publishConfig; passed here
      # too so the command reads the same as it does when run by hand.
      - run: npm publish --provenance --access public
